# Mundwerk's settings. On the first start this file is written to the user's settings folder; from then on
# that copy is the one that counts. The settings window writes it, keeping these comments.

[server]
# The STT-Suite, tried in this order: the first one that answers takes the recording. A server that cannot be
# reached within connect_timeout_ms is skipped; one that answers with an error is not (its answer is shown).
urls = ["http://10.0.0.1:5080", "http://192.168.0.249:5080"]
# The token of the STT-Suite (X-STT-Suite-Token); empty = none (enough on the machine of the suite itself).
token = ""
connect_timeout_ms = 1500

[transcription]
# auto = the STT-Suite chooses GPU or CPU itself (its automatic list, GPU-Orc's traffic light); cuda or cpu = only
# there. Engine and model are the STT-Suite's settings for the device: Mundwerk does not choose them.
device = "auto"
language = "de"

# What starts a dictation: a key, a combination ("Ctrl+Alt+Space") or a mouse button ("Mouse:X1", "Mouse:X2",
# "Mouse:Middle"). hold = record while it is held; toggle = press once to start, once more to stop.
# pass_through = the press also reaches the program below (false: a side button does not also page back).
[[triggers]]
input = "Mouse:X2"
mode = "hold"
pass_through = false

[[triggers]]
input = "F9"
mode = "toggle"
pass_through = false

[recording]
# Empty = the system's default microphone.
microphone = ""
# A press shorter than this is a slip and is thrown away.
min_press_ms = 300
# Throws the recording away without typing anything.
cancel_key = "Escape"
# Stop by itself after this much silence / after this long; 0 = never.
stop_after_silence_s = 0
max_duration_s = 0
# What counts as silence for stop_after_silence_s: a tenth of a second quieter than this, in percent of full scale (RMS).
silence_level_percent = 1

[sounds]
enabled = true
# builtin:<name> = a sound that comes with Mundwerk (ping, pong, break: the Echo Dot's), otherwise a WAV file.
start = "builtin:ping"
stop = "builtin:pong"
cancel = "builtin:break"
volume_percent = 60

[insert]
# type = as if typed (Unicode, umlauts included, the clipboard untouched); clipboard = paste with Ctrl+V and put
# back what the clipboard held.
method = "type"
# A space before the text when the last dictation went into the same window and did not end in a space, so
# that two dictations in a row do not stick together ("…done.Then…").
space_between_dictations = true
# Press Enter after the text (sends a chat message at once).
press_enter = false
# Pasting: how long the program gets to read the clipboard before what it held before is put back.
clipboard_restore_delay_ms = 200
# A key that writes the last dictation once more where the cursor is, for one that went nowhere (no text field had
# the focus). Empty = off.
again_key = ""

# Programs that need the other method, by process name, e.g. a remote desktop or a terminal.
# [[insert.per_program]]
# process = "mstsc.exe"
# method = "clipboard"

# Words the speech recognition gets wrong, especially names. Each rule: what to look for and what to write instead.
# variants = whole words, case ignored; pattern = a regular expression for what variants cannot say.
[[replacements]]
variants = ["Komm mit", "Kommit"]
replacement = "commit"

[[replacements]]
variants = ["Falscode", "VS-Code"]
replacement = "VS Code"

[overlay]
# floating = a small window that shows listening and transcribing, moved anywhere with the mouse (it remembers
# where); tray_only = only the tray icon shows it.
mode = "floating"
opacity_percent = 90
# How long an error stays in the overlay and the tray tooltip.
error_shown_s = 6

[history]
# How many dictations the history keeps (tray menu: a click copies one).
size = 50

[system]
# Start with the system.
autostart = false
