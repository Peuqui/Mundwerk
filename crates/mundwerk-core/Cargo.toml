[package]
name = "mundwerk-core"
description = "Mundwerk's logic without a user interface: settings, replacements, the STT-Suite call, the history"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hound = "3.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Only to run reqwest's async client inside one call (its blocking multipart path reports a refused connection and
# an early 401 as a body error).
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "0.8"
# Changes one value of the settings file (the tray's overlay switch) and keeps its comments.
toml_edit = "0.22"

[lints]
workspace = true
