<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="icon.png" />
  <title>Mundwerk</title>
  <link rel="stylesheet" href="dictation-badge.css" />
  <link rel="stylesheet" href="badge.css" />
</head>
<body>
  <!-- The dictation button's badge, from the STT-Suite's source (ui/badge/ there): the logo in a round badge; while a
       dictation is taken in, the bars rise and fall like a level, the arcs glow and the rim turns red (also where motion is
       reduced, so that it never looks like resting); while it is transcribed, it stands still and grey. -->
  <!-- dictation-badge:begin (from STT-Suite/ui/badge/ by STT-Suite/scripts/sync_ui.py: do not edit) -->
  <svg viewBox="0 0 512 512" class="dictation-badge" aria-hidden="true">
    <defs>
      <linearGradient id="dictation-badge-wave" gradientUnits="userSpaceOnUse" x1="96" y1="116" x2="336" y2="396">
        <stop offset="0" class="wave-start"/>
        <stop offset="0.5" class="wave-middle"/>
        <stop offset="1" class="wave-end"/>
      </linearGradient>
    </defs>
    <circle class="rim" cx="256" cy="256" r="244" stroke-width="24"/>
    <g fill="none" stroke="url(#dictation-badge-wave)" stroke-width="30" stroke-linecap="round">
      <line class="bar" x1="96" y1="226" x2="96" y2="286"/>
      <line class="bar" x1="156" y1="176" x2="156" y2="336"/>
      <line class="bar" x1="216" y1="116" x2="216" y2="396"/>
      <line class="bar" x1="276" y1="166" x2="276" y2="346"/>
      <line class="bar" x1="336" y1="206" x2="336" y2="306"/>
    </g>
    <path class="arc near" d="M388 196 q48 60 0 120" fill="none" stroke-width="22" stroke-linecap="round"/>
    <path class="arc far" d="M424 156 q84 100 0 200" fill="none" stroke-width="22" stroke-linecap="round"/>
  </svg>
  <!-- dictation-badge:end -->
  <script src="badge.js"></script>
</body>
</html>
