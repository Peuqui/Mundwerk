<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="icon.png" />
  <title>Mundwerk</title>
  <link rel="stylesheet" href="badge.css" />
</head>
<body>
  <!-- Agent-Orc's dictation badge (its DictationBadge.vue): the STT-Suite's logo in a round badge, in the STT-Suite
       logo's colours (yellow to orange) and with a light rim; while a dictation is taken in, the bars rise
       and fall like a level, the arcs glow and the rim turns red (also where motion is reduced, so that it never looks
       like resting); while it is transcribed, it stands still and grey. -->
  <svg id="badge" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="badgeWave" gradientUnits="userSpaceOnUse" x1="96" y1="116" x2="336" y2="396">
        <stop offset="0" stop-color="#fef9c3" />
        <stop offset="0.5" stop-color="#f59e0b" />
        <stop offset="1" stop-color="#ea580c" />
      </linearGradient>
    </defs>
    <circle class="rim" cx="256" cy="256" r="244" fill="#0f172a" stroke-width="24" />
    <g fill="none" stroke="url(#badgeWave)" stroke-width="30" stroke-linecap="round">
      <line class="bar" x1="96" y1="226" x2="96" y2="286" />
      <line class="bar" x1="156" y1="176" x2="156" y2="336" />
      <line class="bar" x1="216" y1="116" x2="216" y2="396" />
      <line class="bar" x1="276" y1="166" x2="276" y2="346" />
      <line class="bar" x1="336" y1="206" x2="336" y2="306" />
    </g>
    <path class="arc" d="M388 196 q48 60 0 120" fill="none" stroke="#fef3c7" stroke-width="22" stroke-linecap="round" />
    <path class="arc far" d="M424 156 q84 100 0 200" fill="none" stroke="#fdba74" stroke-width="22" stroke-linecap="round" />
  </svg>
  <script src="badge.js"></script>
</body>
</html>
