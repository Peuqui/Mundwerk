<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="icon.png" />
  <title>Mundwerk</title>
  <link rel="stylesheet" href="badge.css" />
</head>
<body>
  <!-- The STT-Suite's logo in a round badge, as Agent-Orc shows it by the pointer (its DictationBadge.vue): while a
       dictation is taken in, the bars rise and fall like a level and the arcs glow; while it is transcribed, it stands
       still and grey. -->
  <svg id="badge" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="badgeWave" gradientUnits="userSpaceOnUse" x1="96" y1="116" x2="336" y2="396">
        <stop offset="0" stop-color="#38bdf8" />
        <stop offset="1" stop-color="#0369a1" />
      </linearGradient>
    </defs>
    <circle cx="256" cy="256" r="256" fill="#0f172a" />
    <g fill="none" stroke="url(#badgeWave)" stroke-width="30" stroke-linecap="round">
      <line class="bar" x1="96" y1="226" x2="96" y2="286" />
      <line class="bar" x1="156" y1="176" x2="156" y2="336" />
      <line class="bar" x1="216" y1="116" x2="216" y2="396" />
      <line class="bar" x1="276" y1="166" x2="276" y2="346" />
      <line class="bar" x1="336" y1="206" x2="336" y2="306" />
    </g>
    <path class="arc" d="M388 196 q48 60 0 120" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round" />
    <path class="arc far" d="M424 156 q84 100 0 200" fill="none" stroke="#64748b" stroke-width="22" stroke-linecap="round" />
  </svg>
  <script src="badge.js"></script>
</body>
</html>
