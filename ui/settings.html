<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Mundwerk – Einstellungen</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header>
    <h1>Einstellungen</h1>
    <p class="muted">Die Datei <code id="path"></code>. Jede Einstellung ist in ihr erklärt; Speichern prüft sie und
      setzt sie sofort in Kraft.</p>
  </header>
  <div id="message" role="status" hidden></div>
  <textarea id="text" spellcheck="false" autocomplete="off"></textarea>
  <div class="actions">
    <button id="save" class="primary" type="button">Speichern</button>
    <button id="reload" type="button">Verwerfen</button>
    <button id="defaults" type="button">Standardwerte einsetzen</button>
    <button id="microphones" type="button">Mikrofone anzeigen</button>
  </div>
  <ul id="microphone-list" hidden></ul>
  <script src="settings.js"></script>
</body>
</html>
