[workspace]
resolver = "2"
members = ["crates/mundwerk-core", "src-tauri"]
# Plain `cargo test` on any machine: the app needs the system libraries of its platform (see the README).
default-members = ["crates/mundwerk-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Peuqui"]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
